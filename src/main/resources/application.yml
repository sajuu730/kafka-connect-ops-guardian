server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: kafka-connect-ops-guardian
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

guardian:
  connect:
    base-url: ${CONNECT_URL:http://localhost:8083}
    request-timeout: ${CONNECT_REQUEST_TIMEOUT:5s}
  polling:
    enabled: ${GUARDIAN_POLLING_ENABLED:true}
    interval: ${GUARDIAN_POLL_INTERVAL:15s}
    stalled-after: ${GUARDIAN_STALLED_AFTER:2m}
  recovery:
    enabled: ${GUARDIAN_RECOVERY_ENABLED:false}
    max-restarts: ${GUARDIAN_MAX_RESTARTS:3}
    window: ${GUARDIAN_RESTART_WINDOW:15m}
    cooldown: ${GUARDIAN_RESTART_COOLDOWN:2m}
  incidents:
    webhook-url: ${GUARDIAN_WEBHOOK_URL:}
    request-timeout: ${GUARDIAN_WEBHOOK_TIMEOUT:3s}
    max-attempts: ${GUARDIAN_WEBHOOK_MAX_ATTEMPTS:3}
    initial-backoff: ${GUARDIAN_WEBHOOK_INITIAL_BACKOFF:250ms}
    max-backoff: ${GUARDIAN_WEBHOOK_MAX_BACKOFF:2s}
