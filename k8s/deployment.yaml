apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect-ops-guardian
  labels:
    app: kafka-connect-ops-guardian
spec:
  # Restart budgets are process-local; keep one replica while recovery is enabled.
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect-ops-guardian
  template:
    metadata:
      labels:
        app: kafka-connect-ops-guardian
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: guardian
          # Pin a version for reproducible deployments; update deliberately on release.
          image: ghcr.io/sajuu730/kafka-connect-ops-guardian:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kafka-connect-ops-guardian
          env:
            - name: CONNECT_URL
              value: http://kafka-connect:8083
            - name: GUARDIAN_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: kafka-connect-ops-guardian-secrets
                  key: webhook-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect-ops-guardian
spec:
  selector:
    app: kafka-connect-ops-guardian
  ports:
    - name: http
      port: 8080
      targetPort: http
