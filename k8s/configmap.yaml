apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-ops-guardian
data:
  SERVER_PORT: "8080"
  CONNECT_REQUEST_TIMEOUT: "5s"
  GUARDIAN_POLLING_ENABLED: "true"
  GUARDIAN_POLL_INTERVAL: "15s"
  GUARDIAN_RECOVERY_ENABLED: "false"
  GUARDIAN_MAX_RESTARTS: "3"
  GUARDIAN_RESTART_WINDOW: "15m"
  GUARDIAN_RESTART_COOLDOWN: "2m"
  GUARDIAN_WEBHOOK_TIMEOUT: "3s"
  GUARDIAN_WEBHOOK_MAX_ATTEMPTS: "3"
  GUARDIAN_WEBHOOK_INITIAL_BACKOFF: "250ms"
  GUARDIAN_WEBHOOK_MAX_BACKOFF: "2s"
